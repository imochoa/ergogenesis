# yaml-language-server: $schema=https://raw.githubusercontent.com/ergogen/ergogen/refs/heads/master/meta/schema.json

meta:
  engine: 4.1.0 # Min Ergogen version for KiCad 8 footprints
  name: ergogenesis
  version: 1.2
  author: imochoa
  url: https://github.com/imochoa
units:
  # cx: 18mm Choc X spacing
  kx: cx
  # cy: 17mm Choc Y spacing
  ky: cy
  # Padding Variables
  pd: 2
  px: kx + 3
  py: ky + 3
  # U: 19.05mm MX spacing
  # u: 19mm MX spacing
  # For the web preview on ergogen.ceoloide
  $default_width: 18
  $default_height: 17
  # Min sizes of MCU
  mcu_x: 18
  mcu_y: 34
  # Defaults to M2 Screws
  screwSize: 1.5
  standoffSize: 2.5
  # Reset switch sizes
  reset_x: 4.5
  reset_y: 9
  # Case variables
points:
  zones:
    grid-zn:
      anchor:
        # Fix placement on KiCAD sheet.
        shift: [150, -150]
        # rotate: +8
      key:
        padding: 1ky
        spread: 1kx
      columns:
        pinky:
          key:
            rotate: 0
            # col_net: P7
          rows:
            bottom:
              # shift: [-1, 0]
            home:
              rotate: 0
            #   shift: [-2, 0]
            top:
              rotate: 0
            #   shift: [-2, 0]
        ring:
          key:
            splay: 0
            # origin: [-12, -19]
            # stagger: 12.573
            # stagger: 0.66U
            # TODO: is this stagger enough???
            # stagger: 0.4U
            # too much stagger?
            stagger: 14
            # shift: [0,0]
          rows:
            bottom:
              # splay: -50
              # shift: [-1, 0]
              rotate: 0
            home:
              rotate: 0
            #   shift: [-1, 0]
            top:
              rotate: 0
            #   shift: [-1, 0]
        middle:
          key:
            splay: 0
            # stagger: +4.763
            stagger: +0.25U
          rows:
            bottom:
              shift: [0, 0]
            home:
              rotate: 0
            top:
              rotate: 0
        index:
          key:
            # splay:
            # stagger: -4.763
            stagger: -0.25U
            # shift: [0,0]
            # anchor:
            #   shift: [5, 0]
          rows:
            bottom:
              # splay: -50
              shift: [0, 0]
            home:
              shift: [+0, 0]
            top:
              shift: [+0, 0]
        inner:
          key:
            rotate: 0
            # stagger: -4
            stagger: -0.15U
          rows:
            bottom:
              rotate: 0
              # splay: -50
            home:
              shift: [+0, 0]
            top:
              shift: [+0, 0]
      rows:
        bottom:
          rotate: 0
        home:
          rotate: 0
        top:
          rotate: 0
    thumb-zn:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: grid-zn_index_bottom
        # shift: [12.573, -23.81]
        # shift: [0, -py]
        # shift: [0.66U, -1.25U]
        shift: [-0.5kx, -1.1U]
        # rotate: -10
      columns:
        near:
          key:
            rotate: 0
        home:
          key:
            # rotate: 0
            spread: U
            splay: -15
            origin: [-0.5U+0, -0.5U+4]
            # shift: [0, -2.86]
        far:
          key:
            # spread: 19
            # splay: -5
            # origin: [ -45, -15]
            # shift: [0, -10]
            splay: -15
            origin: [-0.5U, -0.5U]
      rows:
        thumb:
          rotate: 0
    mcu-zn:
      anchor:
        ref.aggregate.parts: [grid-zn_inner_top]
        # shift: [+20, -22]
        # shift: [+20, -32]
        # shift: [+20, -26]
        # shift: [+20, -29]
        # shift: [+20, -20]
        # +2mm right: opens gap between inner column pads and MCU left pins (2.4→4.4mm)
        # +4mm up:   opens gap between MCU bottom and thumb cluster (13→17mm)
        shift: [+22, -16]
      # columns.mcu.key.tags: [mcu]
      key.tags:
        - mcu
        - helper
    mountscrew_top_left:
      anchor:
        ref.aggregate.parts:
          [grid-zn_pinky_top, grid-zn_ring_top, grid-zn_ring_home]
        shift: [-3.5+3-1.5, +1.0 + 1.3+1.5]
      # columns.screw.key.tags: [screw]
      key.tags:
        - screw
        - helper
    mountscrew_bottom_left:
      anchor:
        ref.aggregate.parts:
          [grid-zn_pinky_bottom, grid-zn_ring_bottom]
        shift: [-3.5+17, -0.0-9]
      # columns.screw.key.tags: [screw]
      key.tags:
        - screw
        - helper
    # mountscrew_top_right:
    #   anchor:
    #     ref.aggregate.parts:
    #       [
    #         grid-zn_index_top,
    #         grid-zn_index_home,
    #         grid-zn_inner_top,
    #         grid-zn_inner_home,
    #       ]
    #     shift: [0, 0]
    #   # columns.screw.key.tags: [screw]
    #   key.tags:
    #     - screw
    #     - helper
    # mountscrew_bottom_right:
    #   anchor:
    #     ref.aggregate.parts:
    #       [
    #         grid-zn_index_home,
    #         grid-zn_index_bottom,
    #         grid-zn_inner_home,
    #         grid-zn_inner_bottom,
    #       ]
    #     shift: [0, 0]
    #   # columns.screw.key.tags: [screw]
    #   key.tags:
    #     - screw
    #     - helper
    mountscrew_thumb_right:
      anchor:
        ref.aggregate.parts: [thumb-zn_home_thumb, thumb-zn_far_thumb]
        shift: [2+4.217, 5+7.208]
      # columns.screw.key.tags: [screw]
      key.tags:
        - screw
        - helper
outlines:
  # outline of all keys
  _raw_keys_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      # make slightly smaller to avoid merging
      size: [cx-0.1, cy-0.1]
  _padded_keys_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      fillet: 1
      size: [px, py]
  _eastfill_ol:
    - what: polygon
      operation: stack
      fillet: pd
      points:
        # - ref: grid-zn_pinky_bottom
        #   shift: [+2.2px, -0.5py]
        # (for fillet)
        - ref: grid-zn_inner_home
          shift: [+0.5px, +0.5py +8pd]
        - ref: grid-zn_inner_home
          shift: [+0.5px, +0.5py +4pd]
          # surrounding MCU
        - ref: grid-zn_inner_home
          shift: [+0.5px + mcu_x+2pd, +0.5py +4pd]
        - ref: grid-zn_inner_home
          shift: [+0.5px + mcu_x+2pd, +0.5py -mcu_y -2pd - 4]
          # Wrap thumbs
        - ref: thumb-zn_far_thumb
          shift: [+0.5px, +0.5py]
        - ref: thumb-zn_far_thumb
          shift: [+0.5px, 0py]
        - ref: thumb-zn_far_thumb
          shift: [0, -0.5py]
        - ref: thumb-zn_far_thumb
          shift: [-0.5px, -0.5py]
        - ref: thumb-zn_near_thumb
          shift: [+0.5px, -0.5py]
        - ref: thumb-zn_near_thumb
          shift: [0, -0.5py]
        - ref: grid-zn_pinky_bottom
          shift: [+2.3px, -0.5py]
        - ref: grid-zn_pinky_bottom
          shift: [+0.5px, -0.5py]
        - ref: grid-zn_pinky_bottom
          shift: [-0.5px, -0.5py]
  # Underscore -> don't generate it by itself
  _mcu_ol:
    - what: rectangle
      size: [mcu_x, mcu_y]
      # fillet: 1
      where: [mcu]
  # _min_ol:
  #   - name: _keys_ol
  #   - operation: add
  #     name: _mcu_ol
  #   - operation: add
  #     name: _southfill_ol
  #   - operation: add
  #     name: _eastfill_ol
  # - operation: add
  #   name: northfill_ol
  # - operation: add
  #   name: westfill_ol
  # - op        - ref: grid-zn_inner_home
  # shift: [+0.5px, +0.5py]eration: add
  #   name: clamp_ol
  # to see if it all fits
  _holes_ol:
    - what: circle
      radius: screwSize
      where: [screw]
  _standoff_ol:
    - what: circle
      radius: standoffSize
      where: [screw]
  # INFO: rename to stack
  stack_ol:
    - name: _padded_keys_ol
    - operation: stack
      name: _raw_keys_ol
    - operation: stack
      name: _mcu_ol
      # - operation: stack
      #   fillet: 1
    - operation: stack
      name: _eastfill_ol
    - operation: subtract
      name: _holes_ol
    # - operation: stack
    #   name: _southfill_ol
  board_ol:
    - name: _padded_keys_ol
    - operation: add
      fillet: pd
      name: _eastfill_ol
# cases:
#   bottom_cs:
#     - what: outline
#       name: _min_ol
#       extrude: 3
#   # wall stuff...
#   # wall:
#   #   - what: case
#   #     name: _outerWall
#   #     operation: add
#   #   - what: case
#   #     name: _innerWall
