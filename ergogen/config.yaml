pcbs:
  shield-pcb:
    outlines:
      main:
        outline: board_ol
    footprints:
      key-fp:
        # https://github.com/ergogen/ergogen/blob/develop/src/footprints/choc.js
        what: choc
        where:
          # true: all ZONES
          - /grid-zn/
          - /thumb-zn/
        params:
          keycaps: false # do I want it drawn on the PCB? They are not the right size!
          reverse: true
          hotswap: false
          from: GND
          to: "{{name}}"

      mcu-fp:
        # https://github.com/ergogen/ergogen/blob/develop/src/footprints/promicro.js
        # what: promicro
        # ./footprints/promicro-pretty.js
        what: promicro-pretty
        # where: *mcu_where
        where: [mcu]
        params:
          # ./footprints/promicro-pretty.js
          reversable: true
          reversable_pins: 13 # 13: all of them!
          label: true
          instructions: true
          traces: true
          view: true
          # only_required_jumpers: true
          # P0-P10
          # P14-P16
          # P18-P21
          P7: grid-zn_pinky_top
          P18: grid-zn_ring_top
          P19: grid-zn_middle_top
          P20: grid-zn_index_top
          P21: grid-zn_inner_top
          # home
          P15: grid-zn_pinky_home
          P14: grid-zn_ring_home
          P16: grid-zn_middle_home
          P10: grid-zn_index_home
          P1: grid-zn_inner_home
          # bottom
          P2: grid-zn_pinky_bottom
          P3: grid-zn_ring_bottom
          P4: grid-zn_middle_bottom
          P5: grid-zn_index_bottom
          P6: grid-zn_inner_bottom
          # thumb
          P8: thumb-zn_home_thumb
          P9: thumb-zn_far_thumb
          # from me...
          P0: thumb-zn_near_thumb
          # Others...
          # RAW
          # RST
          # VCC
          # GND

      # reset-fp:
      #   # https://github.com/ergogen/ergogen/blob/develop/src/footprints/button.js
      #   what: button
      #   params:
      #     from: GND
      #     to: RST
      battery-connector-fp:
        # ./footprints/jstkss2b-ph-kl.js
        what: jst-s2b-ph-kl
        where:
          ref:
            - grid-zn_inner_bottom
          # pointing to MCU
          # rotate: 180
          # shift: [20, -13]
          rotate: 0
          shift: [+18, +34]
          # # aligned with thumb
          # shift: [30, -20]
          # rotate: +230
        params:
          neg: GND
          pos: pos

      on-off-switch-fp:
        # ./footprints/pcm12.js
        what: pcm12
        where:
          ref:
            - grid-zn_inner_top
          # shift: [32, 3]
          rotate: 180
          # # aligned with thumb
          shift: [19, 6]
          # ref:
          #   - grid-zn_inner_bottom
          # # shift: [32, 3]
          # # rotate: 90
          # # # aligned with thumb
          # shift: [28, -20]
          # rotate: 125
        params:
          from: pos
          to: RAW

      front-text-fp:
        # ./footprints/text.js
        what: text
        where:
          ref:
            - grid-zn_inner_bottom
          shift: [-18, -10]
        params:
          text: blog.imochoa.com
          layer: F.SilkS
          justify: left
          # h_size: 3
          # v_size: 3 # should be same as h_size
          # thickness: 0.15,
          # style: italic
          # Expecting 'face, size, line_spacing, thickness, bold, or italic' in '/var/folders/cp/

      back-text-fp:
        # ./footprints/text.js
        what: text
        where:
          ref:
            - grid-zn_inner_bottom
          shift: [-4.5, -10]
        params:
          text: blog.imochoa.com
          layer: B.SilkS
          justify: left mirror

      # front-img-fp:
      #   # ./footprints/front-image.js
      #   what: front-img
      #   where:
      #     ref: grid-zn_middle_bottom
      #     shift: [+5, -35]
      #   params:
      #     # scale: 0.008
      #     # angle: 200
      #     scale: 0.003
      #     angle: 200

      back-img-fp:
        # ./footprints/back-image.js
        what: back-img
        where:
          ref: grid-zn_middle_bottom
          shift: [-15, +2]
        params:
          scale: 0.035
          angle: 20

      screws-fp:
        # ./footprints/mountinghole.js
        what: mountinghole
        where: [screw]
