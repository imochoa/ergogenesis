# ---------------------------------------------------------------------------
# 3D models
# ---------------------------------------------------------------------------
# Component STEP models live in `ergogen/3dmodels/` and are referenced in
# footprints via the `${ERGOGEN_3DMODELS}` KiCad path variable.
#
# To make KiCad's 3D viewer resolve them, add the variable once:
#   KiCad -> Preferences -> Configure Paths... -> Add
#     Name:  ERGOGEN_3DMODELS
#     Value: <absolute path to>/ergogenesis/ergogen/3dmodels
#
# Offsets below are taken from the ScottoKeebs/Axiom library, which uses these
# same STEP files. Fine-tune in KiCad's 3D viewer if a model sits off.
# Models used (downloaded from github.com/Andreyod1/Axiom):
#   choc_v1.step              - Kailh Choc V1 switch (PG1353)
#   choc_hotswap.step         - Choc hotswap socket
#   choc_keycap_1u.step       - MBK 1u keycap
#   switch_msk12c02.step      - MSK12C02 / SSSS811101 side slide switch
#   jst_ph_s2b.step           - JST PH 2.0 battery connector (S2B-PH)
#   supermini_nrf52840.step   - Nice!Nano V2 model as a SuperMini stand-in
#                              (same Pro Micro form factor / USB-C; no public
#                              SuperMini STEP exists - swap in a real one if
#                              you find it).
pcbs:
  shield-pcb:
    template: kicad8 # Required, since footprints are KiCad 8 only
    outlines:
      main:
        outline: board_ol
    footprints:
      key-fp:
        # what: choc
        # https://github.com/ceoloide/ergogen-footprints/blob/main/switch_choc_v1_v2.js
        # ./footprints/ceoloide/switch_choc_v1_v2.js
        what: ceoloide/switch_choc_v1_v2
        where:
          # true: all ZONES
          - /grid-zn/
          - /thumb-zn/
        params:
          choc_v1_support: true
          choc_v2_support: false
          reversible: true
          hotswap: true
          solder: true
          keycap_height: ky
          keycap_width: kx
          # alternate version?
          include_plated_holes: true
          include_traces_vias: true
          # freerouting
          locked_traces_vias: true
          from: GND
          to: "{{name}}"
          # --- 3D models ---
          # Switch body, hotswap socket, and MBK keycap. Keycap is rotated
          # [0,180,90] and lifted 7.7mm to sit atop the switch (matches the
          # ScottoKeebs CAD_Choc footprint these STEP files ship with).
          switch_3dmodel_filename: ${ERGOGEN_3DMODELS}/choc_v1.step
          switch_3dmodel_xyz_offset: [0, 0, 0]
          switch_3dmodel_xyz_rotation: [0, 0, 0]
          switch_3dmodel_xyz_scale: [1, 1, 1]
          hotswap_3dmodel_filename: ${ERGOGEN_3DMODELS}/choc_hotswap.step
          # 180° Z rotation flips the socket from bottom-right (where the
          # STEP model's origin sits by default, on the solder backup pins)
          # to top-left, where this reversible footprint's hotswap pads are.
          hotswap_3dmodel_xyz_offset: [0, 0, 0]
          hotswap_3dmodel_xyz_rotation: [0, 0, 180]
          hotswap_3dmodel_xyz_scale: [1, 1, 1]
          keycap_3dmodel_filename: ${ERGOGEN_3DMODELS}/choc_keycap_1u.step
          keycap_3dmodel_xyz_offset: [0, 0, 7.7]
          keycap_3dmodel_xyz_rotation: [0, 180, 90]
          keycap_3dmodel_xyz_scale: [1, 1, 1]

      mcu-fp:
        what: ceoloide/mcu_supermini_nrf52840
        where: [mcu]
        params:
          reversible: true
          reverse_mount: true
          # show_silk_labels: false
          # show_via_labels: false
          # show_instructions: false
          only_required_jumpers: true
          use_rectangular_jumpers: true
          # P0-P10
          # P14-P16
          # P18-P21
          P7: grid-zn_middle_bottom
          P18: grid-zn_pinky_home
          P19: grid-zn_pinky_top
          P20: grid-zn_index_top
          P21: grid-zn_inner_top
          # home
          P15: grid-zn_pinky_bottom
          P14: thumb-zn_near_thumb
          P16: thumb-zn_home_thumb
          P10: thumb-zn_far_thumb
          P1: grid-zn_middle_top
          # bottom
          P2: grid-zn_middle_home
          P3: grid-zn_index_home  
          P4: grid-zn_inner_home
          P5: grid-zn_ring_home
          P6: grid-zn_ring_bottom
          # thumb
          P8: grid-zn_index_bottom 
          P9: grid-zn_inner_bottom
          # from me...
          P0: grid-zn_ring_top
          # P0: thumb-zn_near_thumb
          # Others...
          # RAW
          # RST
          # VCC
          # GND
          # Silkscreen labels: short Arduino Pro Micro pin numbers
          # (net names above are unaffected; only the silk text changes).
          # See https://zmk.dev/docs/hardware-integration/pinctrl
          # P0_label: D0
          # P1_label: D1
          # P2_label: D2
          # P3_label: D3
          # P4_label: D4
          # P5_label: D5
          # P6_label: D6
          # P7_label: D7
          # P8_label: D8
          # P9_label: D9
          # P10_label: D10
          # P14_label: D14
          # P15_label: D15
          # P16_label: D16
          # P18_label: A0
          # P19_label: A1
          # P20_label: A2
          # P21_label: A3
          # Silkscreen labels: ergogen point names so you can trace a
          # KiCad pin back to its `Pxx:` assignment in this file.
          P0_label: P0
          P1_label: P1
          P2_label: P2
          P3_label: P3
          P4_label: P4
          P5_label: P5
          P6_label: P6
          P7_label: P7
          P8_label: P8
          P9_label: P9
          P10_label: P10
          P14_label: P14
          P15_label: P15
          P16_label: P16
          P18_label: P18
          P19_label: P19
          P20_label: P20
          P21_label: P21
          # --- 3D model ---
          # Nice!Nano V2 STEP as a visual stand-in for the SuperMini NRF52840
          # (same Pro Micro form factor + USB-C). Offset [0, 1.25, 2.5] lifts
          # the board to sit on the castellated pads.
          mcu_3dmodel_filename: ${ERGOGEN_3DMODELS}/supermini_nrf52840.step
          mcu_3dmodel_xyz_offset: [0, 1.25, 2.5]
          mcu_3dmodel_xyz_rotation: [0, 0, 0]
          mcu_3dmodel_xyz_scale: [1, 1, 1]
        # adjust:
        #   shift: [19.704, 0.375 kp -18.37]

      # reset-fp:
      #   # https://github.com/ergogen/ergogen/blob/develop/src/footprints/button.js
      #   what: button
      #   params:
      #     from: GND
      #     to: RST
      #
      on_off_switch-fp:
        #   # ./footprints/pcm12.js
        #   what: pcm12
        # ./footprints/ceoloide/power_switch_smd_side.js
        what: ceoloide/power_switch_smd_side
        # where: grid-zn_inner_top
        # where: [mcu]
        where: [grid-zn_inner_bottom]
        params:
          from: BAT_P
          to: RAW
          reversible: true
          # --- 3D model ---
          # MSK12C02 side slide switch (compatible with the SSSS811101 /
          # PCM12SMTR the footprint targets). Rotated 90° about Z because
          # the ceoloide footprint orients the pin row vertically (left edge)
          # while the STEP model was authored for a horizontal pin row.
          switch_3dmodel_filename: ${ERGOGEN_3DMODELS}/switch_msk12c02.step
          switch_3dmodel_xyz_offset: [0, 0, -0.05]
          switch_3dmodel_xyz_rotation: [0, 0, 90]
          switch_3dmodel_xyz_scale: [1, 1, 1]
        adjust:
          rotate: 0 
          # shift: [+0.5mcu_x -0.5 reset_x-13, -0.5mcu_y+41+4+0.5+3-3.5-0.5]
          # shift: [+28, -10]
          # shift: [+30.5, -10]
          shift: [+30.0, -10]

      battery_connector-fp:
        #   # ./footprints/jstkss2b-ph-kl.js
        #   what: jst-s2b-ph-kl
        # ./footprints/ceoloide/battery_connector_jst_ph_2.js
        what: ceoloide/battery_connector_jst_ph_2
        # where: grid-zn_inner_top
        # where: [mcu]
        where: [grid-zn_inner_bottom]
        params:
          BAT_P: BAT_P
          BAT_N: GND
          reversible: true
          trace_width: 0.3
          # --- 3D model ---
          # JST PH 2.0 side-entry connector. Uses the official KiCad library
          # S2B-PH-K horizontal STEP (same pad layout: pins at ±1, 0), so no
          # offset or rotation is needed.
          battery_connector_3dmodel_filename: ${ERGOGEN_3DMODELS}/jst_ph_s2b.step
          battery_connector_3dmodel_xyz_offset: [0, 0, 0]
          battery_connector_3dmodel_xyz_rotation: [0, 0, 0]
          battery_connector_3dmodel_xyz_scale: [1, 1, 1]
        adjust:
          # shift: [-10+12+4, -0.5 mcu_y+39+3+1+3+2-3.5]
          # shift: [-10+12+4, -0.5 mcu_y]
          # shift: [+20, -8]
          # shift: [+20, -8-4]
          shift: [+22, -8-4-2]
          # rotate: -90 +45
          # rotate: 0
          rotate: 180

      # reset_switch-fp:
      #   what: ceoloide/reset_switch_smd_side
      #   # where: grid-zn_inner_top
      #   where: [mcu]
      #   params:
      #     from: GND
      #     to: RST
      #     reversible: true
      #     include_bosses: true
      #   adjust:
      #     shift: [0, +0.5 mcu_y]

      gnd_fill_back-fp:
        what: ceoloide/utility_filled_zone
        # IMPORTANT: use a SINGLE anchor (e.g. [mcu]) so the zone is emitted once.
        # `where: true` would create one copy per key point (~24 stacked zones).
        # The polygon `points` below are absolute KiCad coords, so the chosen
        # anchor location does not affect where the fill ends up.
        where: [mcu]
        params:
          side: "B"
          net: GND
          name: "GND_back"
          # Generous bounding box in ABSOLUTE KiCad coordinates (Y is positive-down).
          # Current board bbox: X ~139..249, Y ~94..178. Box overshoots on all sides;
          # KiCad clips the zone to Edge.Cuts (board_ol) automatically.
          points:
            - [100, 80]
            - [280, 80]
            - [280, 200]
            - [100, 200]
          # --- JLCPCB-friendly settings ---
          # JLC min trace/clearance is 0.127mm; we keep ≥0.2mm with margin.
          min_thickness: 0.3 # > JLC floor (0.127), avoids hairline slivers
          pad_clearance: 0.3 # > JLC floor (0.127), still lets fill flow between pads
          # SMD pads -> solid tie (better GND return); THT pads -> thermals (solderable by hand).
          connect_pads: "thru_hole_only"
          thermal_gap: 0.3
          thermal_bridge_width: 0.3
          # No floating copper islands (JLC dislikes them, also better EMI).
          remove_islands: "always"
          # Solid is fine on a small keyboard PCB; hatch is mainly for large/warp-prone boards.
          fill_type: solid
          corner_smoothing: "fillet"
          smoothing_radius: 0.5

      # front-text-fp:
      #   # ./footprints/text.js
      #   what: text
      #   where:
      #     ref:
      #       - grid-zn_inner_bottom
      #     shift: [-18, -10]
      #   params:
      #     text: blog.imochoa.com
