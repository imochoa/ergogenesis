      #   where:
      #     ref:
      #       - grid-zn_inner_bottom
      #     shift: [-4.5, -10]
      #   params:
      #     text: blog.imochoa.com
      #     layer: B.SilkS
      #     justify: left mirror

      # front-img-fp:
      #   # ./footprints/front-image.js
      #   what: front-img
      #   where:
      #     ref: grid-zn_middle_bottom
      #     shift: [+5, -35]
      #   params:
      #     # scale: 0.008
      #     # angle: 200
      #     scale: 0.003
      #     angle: 200

      # back-img-fp:
      #   # ./footprints/back-image.js
      #   what: back-img
      #   where:
      #     ref: grid-zn_middle_bottom
      #     shift: [-15, +2]
      #   params:
      #     scale: 0.035
      #     angle: 20
      screws-fp:
        # ./footprints/ceoloide/mounting_hole_npth.js
        what: ceoloide/mounting_hole_npth
        where: [screw]
