# yaml-language-server: $schema=https://raw.githubusercontent.com/ergogen/ergogen/refs/heads/master/meta/schema.json

meta:
  engine: 4.1.0
  name: ergogenesis
  version: 1.2
  author: imochoa
  url: https://github.com/imochoa
units:
  kx: cx
  ky: cy
  # U: 19.05mm MX spacing
  # u: 19mm MX spacing
  # cx: 18mm Choc X spacing
  # cy: 17mm Choc Y spacing
  # For the web preview on ergogen.ceoloide
  $default_width: 18
  $default_height: 17
  # Padding Variables
  px: kx + 2
  py: ky + 2
  # Min sizes of MCU
  mcu_x: 18
  mcu_y: 34
  # Defaults to M2 Screws
  screwSize: 1.5
  standoffSize: 2.5
  # Reset switch sizes
  reset_x: 4.5
  reset_y: 9
points:
  zones:
    grid-zn:
      anchor:
        # Fix placement on KiCAD sheet.
        shift: [150, -150]
        rotate: +8
      key:
        padding: 1ky
        spread: 1kx
      columns:
        pinky:
          key:
            rotate: 0
            # col_net: P7
          rows:
            bottom:
              shift: [-1, 0]
            home:
              rotate: 0
            #   shift: [-2, 0]
            top:
              rotate: 0
            #   shift: [-2, 0]
        ring:
          key:
            splay: -2
            origin: [-12, -19]
            stagger: 12.573
            # shift: [0,0]
          rows:
            bottom:
              # splay: -50
              shift: [-1, 0]
              rotate: 0
            home:
              rotate: 0
            #   shift: [-1, 0]
            top:
              rotate: 0
            #   shift: [-1, 0]
        middle:
          key:
            splay: -2
            stagger: +4.763
          rows:
            bottom:
              shift: [0, 0]
            home:
              rotate: 0
            top:
              rotate: 0
        index:
          key:
            # splay:
            stagger: -4.763
            # shift: [0,0]
            anchor:
              shift: [5, 0]
          rows:
            bottom:
              # splay: -50
              shift: [0, 0]
            home:
              shift: [+0, 0]
            top:
              shift: [+0, 0]
        inner:
          key:
            rotate: 0
            stagger: -4
          rows:
            bottom:
              rotate: 0
              # splay: -50
            home:
              shift: [+0, 0]
            top:
              shift: [+0, 0]
      rows:
        bottom:
          rotate: 0
        home:
          rotate: 0
        top:
          rotate: 0
    thumb-zn:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: grid-zn_index_bottom
        # shift: [12.573, -23.81]
        shift: [0, -py]
        # rotate: -1
      columns:
        near:
          key:
            rotate: 0
        home:
          key:
            rotate: 0
            # spread: 20
            # splay: -5
            # origin: [-15, -5]
            # shift: [0, -2.86]
        far:
          key:
            # spread: 19
            # splay: -5
            # origin: [ -45, -15]
            shift: [0, -10]
      rows:
        thumb:
          rotate: 0
    mcu-zn:
      anchor:
        ref.aggregate.parts: [grid-zn_inner_top]
        shift: [+19.05, -32]
      columns.mcu.key.tags: [mcu]
    mountscrew_top_left:
      anchor:
        ref.aggregate.parts:
          [grid-zn_pinky_top, grid-zn_ring_top, grid-zn_ring_home]
        shift: [-3.5, +1.0]
      columns.screw.key.tags: [screw]
    mountscrew_bottom_left:
      anchor:
        ref.aggregate.parts:
          [grid-zn_pinky_home, grid-zn_ring_home, grid-zn_ring_bottom]
        shift: [-3.5, -0.0]
      columns.screw.key.tags: [screw]
    mountscrew_top_right:
      anchor:
        ref.aggregate.parts:
          [
            grid-zn_index_top,
            grid-zn_index_home,
            grid-zn_inner_top,
            grid-zn_inner_home,
          ]
        shift: [0, 0]
      columns.screw.key.tags: [screw]
    mountscrew_bottom_right:
      anchor:
        ref.aggregate.parts:
          [
            grid-zn_index_home,
            grid-zn_index_bottom,
            grid-zn_inner_home,
            grid-zn_inner_bottom,
          ]
        shift: [0, 0]
      columns.screw.key.tags: [screw]
    mountscrew_thumb_right:
      anchor:
        ref.aggregate.parts: [thumb-zn_home_thumb, thumb-zn_far_thumb]
        shift: [2, 5]
      columns.screw.key.tags: [screw]
outlines:
  # outline of all keys
  _raw_keys_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      # make slightly smaller to avoid merging
      size: [cx-0.1, cy-0.1]
  _padded_keys_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      fillet: 1
      size: [px, py]
  # _southfill_ol:
  #   - what: polygon
  #     operation: stack
  #     fillet: 2
  #     points:
  #       - ref: grid-zn_pinky_bottom
  #         shift: [-0.5px, -0.5py]
  #       - ref: grid-zn_pinky_bottom
  #         shift: [+0.5px, -0.5py]
  #       - ref: thumb-zn_near_thumb
  #         shift: [-0.5px, -0.5py]
  #       - ref: thumb-zn_near_thumb
  #         shift: [+0.5px, -0.5py]
  #       - ref: grid-zn_middle_top
  #         shift: [+0.5px, -0.5py]
  # _eastfill_ol:
  #   - what: polygon
  #     operation: stack
  #     fillet: 2
  #     points:
  #       - ref: grid-zn_inner_top
  #         shift: [0, +.5py]
  #       - ref: grid-zn_inner_top
  #         shift: [+29, +.5py]
  #       - ref: thumb-zn_far_thumb
  #         shift: [+0.5px, -0.5py]
  #       - ref: thumb-zn_far_thumb
  #         shift: [-0.5px, -0.5py]
  #       - ref: grid-zn_inner_home
  #         shift: [+0.5px, -0.5py]
  # Underscore -> don't generate it by itself
  _mcu_ol:
    - what: rectangle
      # size: [18,34] # min size [mm]
      size: [mcu_x, mcu_y]
      # fillet: 1
      where: [mcu]
      # where: &mcu_where
      #   ref: grid-zn_inner_top
      #   shift: [+19.05, -32]
  # _min_ol:
  #   - name: _keys_ol
  #   - operation: add
  #     name: _mcu_ol
  #   - operation: add
  #     name: _southfill_ol
  #   - operation: add
  #     name: _eastfill_ol
  # - operation: add
  #   name: northfill_ol
  # - operation: add
  #   name: westfill_ol
  # - operation: add
  #   name: clamp_ol
  # to see if it all fits
  # INFO: rename to stack
  stack_ol:
    - name: _padded_keys_ol
    - operation: stack
      name: _raw_keys_ol
    - operation: stack
      name: _mcu_ol
  board_ol:
    - name: _padded_keys_ol
  # _holes_ol:
  #   - what: circle
  #     radius: screwSize
  #     where: [screw]
  # _standoff_ol:
  #   - what: circle
  #     radius: standoffSize
  #     where: [screw]
# cases:
#   bottom_cs:
#     - what: outline
#       name: _min_ol
#       extrude: 3
#   # wall stuff...
#   # wall:
#   #   - what: case
#   #     name: _outerWall
#   #     operation: add
#   #   - what: case
#   #     name: _innerWall
#   #     operation: subtract
#   holes_cs:
#     - name: _holes_ol
#       extrude: 4
#   standoff_cs:
#     - name: _standoff_ol
#       extrude: 4
#   case_cs:
#     - what: case
#       name: bottom_cs
#       operation: add
#     - what: case
#       name: standoff_cs
#       operation: add
#     - what: case
