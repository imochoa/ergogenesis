# One repository-level pre-commit configuration dispatches checks by path.
# Hardware checks its justfile; firmware's expensive ZMK build runs in its
# Podman devcontainer at pre-push, not on every commit.
minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        files: ^(?:hardware/ergogen/|firmware/config/).*\.ya?ml$

  - repo: local
    hooks:
      - id: hardware-justfile-format
        name: hardware justfile format
        entry: bash -c 'cd hardware && just --fmt --check --unstable'
        language: system
        pass_filenames: false
        files: ^hardware/(?:justfile|.*\.just)$

      - id: firmware-justfile-format
        name: firmware justfile format
        entry: bash -c 'cd firmware && just --fmt --check --unstable'
        language: system
        pass_filenames: false
        files: ^firmware/(?:justfile|\.just/.*\.just)$

      - id: firmware-zmk-build
        name: firmware ZMK build (Podman devcontainer)
        entry: bash -c 'cd firmware && just ci'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^firmware/(?:config/|\.just/|justfile$|\.devcontainer/)
