# yaml-language-server: $schema=https://raw.githubusercontent.com/ergogen/ergogen/refs/heads/master/meta/schema.json

meta:
  engine: 4.1.0 # Min Ergogen version for KiCad 8 footprints
  name: ergogenesis
  version: 1.2
  author: imochoa
  url: https://github.com/imochoa
units:
  # cx: 18mm Choc X spacing
  kx: cx
  # cy: 17mm Choc Y spacing
  ky: cy
  # Padding Variables
  pd: 2
  px: kx + 3
  py: ky + 3
  # U: 19.05mm MX spacing
  # u: 19mm MX spacing
  # For the web preview on ergogen.ceoloide
  $default_width: 18
  $default_height: 17
  # Min sizes of MCU
  mcu_x: 18
  mcu_y: 34
  # Defaults to M2 Screws
  screwSize: 1.5
  standoffSize: 2.5
  # Reset switch sizes
  reset_x: 4.5
  reset_y: 9
  # --- Case / plate variables ---
  # Choc v1 switch-plate cutout (the clip needs ~1.2-1.6mm plate to engage).
  kcow: 13.8 # key cutout width  (choc v1: 13.8, choc v2 / MX: 14)
  kcoh: 13.8 # key cutout height (choc v1: 13.8, choc v2 / MX: 14)
  plate_thickness: 1.6       # stabilization (switch) plate
  bottom_plate_thickness: 2.0 # base plate
  # --- Case variables ---
  wall_height: 5.0           # perimeter wall height above the standoffs (mm)
  wall_thickness: 2.0        # perimeter wall thickness (mm)
  standoff_height: 2.0       # standoff height above the base (mm)
  pcb_to_plate_tolerance: 0.25
  # Hotswap-socket clearance cutout in the base. The Choc hotswap socket
  # bridges the central hole (0, +5.95) and a side hole at (+/-5, +3.75) in
  # the key's local frame (+Y = north / toward the top row). On a reversible
  # board the socket sits bottom-WEST when populated on the front and
  # bottom-EAST when populated on the back. One symmetric slot covers BOTH
  # positions, so a single base works for either side (and for both halves
  # of a split where one PCB is flipped).
  # from AI
  # socket_cutout_w: 12
  # socket_cutout_h: 5
  # my measurements in FreeCAD
  socket_cutout_w: 19
  socket_cutout_h: 8
  socket_cutout_y: 4.85 # north side of the key, mm
points:
  zones:
    grid-zn:
      anchor:
        # Fix placement on KiCAD sheet.
        shift: [150, -150]
        # rotate: +8
      key:
        padding: 1ky
        spread: 1kx
      columns:
        pinky:
          key:
            rotate: 0
            # col_net: P7
          rows:
            bottom:
              # shift: [-1, 0]
            home:
              rotate: 0
            #   shift: [-2, 0]
            top:
              rotate: 0
            #   shift: [-2, 0]
        ring:
          key:
            splay: 0
            # origin: [-12, -19]
            # stagger: 12.573
            # stagger: 0.66U
            # TODO: is this stagger enough???
            # stagger: 0.4U
            # too much stagger?
            stagger: 14
            # shift: [0,0]
          rows:
            bottom:
              # splay: -50
              # shift: [-1, 0]
              rotate: 0
            home:
              rotate: 0
            #   shift: [-1, 0]
            top:
              rotate: 0
            #   shift: [-1, 0]
        middle:
          key:
            splay: 0
            # stagger: +4.763
            stagger: +0.25U
          rows:
            bottom:
              shift: [0, 0]
            home:
              rotate: 0
            top:
              rotate: 0
        index:
          key:
            # splay:
            # stagger: -4.763
            stagger: -0.25U
            # shift: [0,0]
            # anchor:
            #   shift: [5, 0]
          rows:
            bottom:
              # splay: -50
              shift: [0, 0]
            home:
              shift: [+0, 0]
            top:
              shift: [+0, 0]
        inner:
          key:
            rotate: 0
            # stagger: -4
            stagger: -0.15U
          rows:
            bottom:
              rotate: 0
              # splay: -50
            home:
              shift: [+0, 0]
            top:
              shift: [+0, 0]
      rows:
        bottom:
          rotate: 0
        home:
          rotate: 0
        top:
          rotate: 0
    thumb-zn:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: grid-zn_index_bottom
        # shift: [12.573, -23.81]
        # shift: [0, -py]
        # shift: [0.66U, -1.25U]
        shift: [-0.5kx, -1.1U]
        # rotate: -10
      columns:
        near:
          key:
            rotate: 0
        home:
          key:
            # rotate: 0
            spread: U
            splay: -15
            origin: [-0.5U+0, -0.5U+4]
            # shift: [0, -2.86]
        far:
          key:
            # spread: 19
            # splay: -5
            # origin: [ -45, -15]
            # shift: [0, -10]
            splay: -15
            origin: [-0.5U, -0.5U]
      rows:
        thumb:
          rotate: 0
    mcu-zn:
      anchor:
        ref.aggregate.parts: [grid-zn_inner_top]
        # shift: [+20, -22]
        # shift: [+20, -32]
        # shift: [+20, -26]
        # shift: [+20, -29]
        # shift: [+20, -20]
        # +2mm right: opens gap between inner column pads and MCU left pins (2.4→4.4mm)
        # +4mm up:   opens gap between MCU bottom and thumb cluster (13→17mm)
        shift: [+22, -16]
      # columns.mcu.key.tags: [mcu]
      key.tags:
        - mcu
        - helper
    mountscrew_top_left:
      anchor:
        ref.aggregate.parts:
          [grid-zn_pinky_top, grid-zn_ring_top, grid-zn_ring_home]
        shift: [-3.5+3-1.5, +1.0 + 1.3+1.5]
      # columns.screw.key.tags: [screw]
      key.tags:
        - screw
        - helper
    mountscrew_bottom_left:
      anchor:
        ref.aggregate.parts:
          [grid-zn_pinky_bottom, grid-zn_ring_bottom]
        shift: [-3.5+17, -0.0-9]
      # columns.screw.key.tags: [screw]
      key.tags:
        - screw
        - helper
    # mountscrew_top_right:
    #   anchor:
    #     ref.aggregate.parts:
    #       [
    #         grid-zn_index_top,
    #         grid-zn_index_home,
    #         grid-zn_inner_top,
    #         grid-zn_inner_home,
    #       ]
    #     shift: [0, 0]
    #   # columns.screw.key.tags: [screw]
    #   key.tags:
    #     - screw
    #     - helper
    # mountscrew_bottom_right:
    #   anchor:
    #     ref.aggregate.parts:
    #       [
    #         grid-zn_index_home,
    #         grid-zn_index_bottom,
    #         grid-zn_inner_home,
    #         grid-zn_inner_bottom,
    #       ]
    #     shift: [0, 0]
    #   # columns.screw.key.tags: [screw]
    #   key.tags:
    #     - screw
    #     - helper
    mountscrew_thumb_right:
      anchor:
        ref.aggregate.parts: [thumb-zn_home_thumb, thumb-zn_far_thumb]
        shift: [2+4.217, 5+7.208]
      # columns.screw.key.tags: [screw]
      key.tags:
        - screw
        - helper
outlines:
  # outline of all keys
  _raw_keys_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      # make slightly smaller to avoid merging
      size: [cx-0.1, cy-0.1]
  _padded_keys_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      fillet: 1
      size: [px, py]
  _eastfill_ol:
    - what: polygon
      operation: stack
      fillet: pd
      points:
        # - ref: grid-zn_pinky_bottom
        #   shift: [+2.2px, -0.5py]
        # (for fillet)
        - ref: grid-zn_inner_home
          shift: [+0.5px, +0.5py +8pd]
        - ref: grid-zn_inner_home
          shift: [+0.5px, +0.5py +4pd]
          # surrounding MCU
        - ref: grid-zn_inner_home
          shift: [+0.5px + mcu_x+2pd, +0.5py +4pd]
        - ref: grid-zn_inner_home
          shift: [+0.5px + mcu_x+2pd, +0.5py -mcu_y -2pd - 4]
          # Wrap thumbs
        - ref: thumb-zn_far_thumb
          shift: [+0.5px, +0.5py]
        - ref: thumb-zn_far_thumb
          shift: [+0.5px, 0py]
        - ref: thumb-zn_far_thumb
          shift: [0, -0.5py]
        - ref: thumb-zn_far_thumb
          shift: [-0.5px, -0.5py]
        - ref: thumb-zn_near_thumb
          shift: [+0.5px, -0.5py]
        - ref: thumb-zn_near_thumb
          shift: [0, -0.5py]
        - ref: grid-zn_pinky_bottom
          shift: [+2.3px, -0.5py]
        - ref: grid-zn_pinky_bottom
          shift: [+0.5px, -0.5py]
        - ref: grid-zn_pinky_bottom
          shift: [-0.5px, -0.5py]
  # Underscore -> don't generate it by itself
  _mcu_ol:
    - what: rectangle
      size: [mcu_x, mcu_y]
      # fillet: 1
      where: [mcu]
  # _min_ol:
  #   - name: _keys_ol
  #   - operation: add
  #     name: _mcu_ol
  #   - operation: add
  #     name: _southfill_ol
  #   - operation: add
  #     name: _eastfill_ol
  # - operation: add
  #   name: northfill_ol
  # - operation: add
  #   name: westfill_ol
  # - op        - ref: grid-zn_inner_home
  # shift: [+0.5px, +0.5py]eration: add
  #   name: clamp_ol
  # to see if it all fits
  _holes_ol:
    - what: circle
      radius: screwSize
      where: [screw]
  _standoff_ol:
    - what: circle
      radius: standoffSize
      where: [screw]
  # INFO: rename to stack
  stack_ol:
    - name: _padded_keys_ol
    - operation: stack
      name: _raw_keys_ol
    - operation: stack
      name: _mcu_ol
      # - operation: stack
      #   fillet: 1
    - operation: stack
      name: _eastfill_ol
    - operation: subtract
      name: _holes_ol
    # - operation: stack
    #   name: _southfill_ol
  board_ol:
    - name: _padded_keys_ol
    - operation: add
      fillet: pd
      name: _eastfill_ol
  # ---------------------------------------------------------------------------
  # Switch (stabilization) plate cutouts: one Choc cutout per key.
  # ---------------------------------------------------------------------------
  _switch_cutouts_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      size: [kcow, kcoh]
  # ---------------------------------------------------------------------------
  # Hotswap-socket clearance cutouts for the base: one symmetric slot per
  # key covering both the front (west) and back (east) socket positions.
  # ---------------------------------------------------------------------------
  _hotswap_socket_cutouts_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      size: [socket_cutout_w, socket_cutout_h]
      adjust:
        shift: [0, socket_cutout_y]
  # Stabilization (switch) plate: PCB outline + Choc cutouts + screw holes.
  # Exported as a DXF for laser/waterjet cutting, and extruded as a case below.
  switch_plate_ol:
    - name: board_ol
    - operation: subtract
      name: _switch_cutouts_ol
    - operation: subtract
      name: _holes_ol
  # Base plate: PCB outline + socket clearance cutouts + screw holes.
  bottom_plate_ol:
    - name: board_ol
    - operation: subtract
      name: _hotswap_socket_cutouts_ol
    - operation: subtract
      name: _holes_ol
  # Case base: solid board outline with screw through-holes only (no hotswap
  # socket cutouts — those are only needed on the laser-cut bottom plate).
  _case_base_ol:
    - name: board_ol
    - operation: subtract
      name: _holes_ol
  # Cutout through the wall for the power switch slider. Positioned at the
  # same anchor as on_off_switch-fp, but shifted to overlap the wall (which
  # is wall_thickness beyond the board edge), not the switch center.
  _switch_wall_cutout_ol:
    - what: rectangle
      where:
        ref: grid-zn_inner_bottom
        shift: [+30.0 + wall_thickness + 1, -10]
      # 4mm wide (spans the 2mm wall + margin on each side) × 8mm tall
      # (covers the slider with finger access).
      size: [4, 8]
  # ---------------------------------------------------------------------------
  # Case outlines
  # ---------------------------------------------------------------------------
  # Outer perimeter of the case: board_ol expanded by wall_thickness on every
  # side. ergogen's rectangle `spread`/`padding` isn't available for arbitrary
  # outlines, so we approximate the expansion by stacking a slightly larger
  # padded-keys outline + eastfill with extra padding. A simpler, reliable
  # approach is to use the `glue` operation with an expanded mirror — but the
  # cleanest method (per flatfootfox) is to define a second board outline with
  # extra padding units and subtract the original from it.
  _case_outer_ol:
    - what: rectangle
      where:
        - /grid-zn/
        - /thumb-zn/
      fillet: 1
      # px/py already include 3mm padding (kx+3 / ky+3); add wall_thickness
      # more on each side.
      size: [px + 2 * wall_thickness, py + 2 * wall_thickness]
    - operation: stack
      what: rectangle
      size: [mcu_x + 2 * wall_thickness, mcu_y + 2 * wall_thickness]
      where: [mcu]
    - operation: add
      fillet: pd + wall_thickness
      what: polygon
      points:
        - ref: grid-zn_inner_home
          shift: [+0.5px + wall_thickness, +0.5py + 8pd + wall_thickness]
        - ref: grid-zn_inner_home
          shift: [+0.5px + wall_thickness, +0.5py + 4pd + wall_thickness]
        - ref: grid-zn_inner_home
          shift: [+0.5px + mcu_x + 2pd + wall_thickness, +0.5py + 4pd + wall_thickness]
        - ref: grid-zn_inner_home
          shift: [+0.5px + mcu_x + 2pd + wall_thickness, +0.5py - mcu_y - 2pd - 4 - wall_thickness]
        - ref: thumb-zn_far_thumb
          shift: [+0.5px + wall_thickness, +0.5py + wall_thickness]
        - ref: thumb-zn_far_thumb
          shift: [+0.5px + wall_thickness, 0py]
        - ref: thumb-zn_far_thumb
          shift: [0, -0.5py - wall_thickness]
        - ref: thumb-zn_far_thumb
          shift: [-0.5px - wall_thickness, -0.5py - wall_thickness]
        - ref: thumb-zn_near_thumb
          shift: [+0.5px + wall_thickness, -0.5py - wall_thickness]
        - ref: thumb-zn_near_thumb
          shift: [0, -0.5py - wall_thickness]
        - ref: grid-zn_pinky_bottom
          shift: [+2.3px + wall_thickness, -0.5py - wall_thickness]
        - ref: grid-zn_pinky_bottom
          shift: [+0.5px + wall_thickness, -0.5py - wall_thickness]
        - ref: grid-zn_pinky_bottom
          shift: [-0.5px - wall_thickness, -0.5py - wall_thickness]
  # The wall ring: outer case outline minus the board outline.
  _wall_ring_ol:
    - name: _case_outer_ol
    - operation: subtract
      name: board_ol
# ---------------------------------------------------------------------------
# Cases
# ---------------------------------------------------------------------------
# Sandwich case: the PCB sits between the stabilization (switch) plate on
# top and the base plate on the bottom, held together by M2 screws through
# the mounting holes. The switch plate's Choc cutouts hold the switches so
# they can't fall out of the hotswap sockets. The base plate has a slot per
# key clearing the hotswap socket (which side it sits on depends on which
# side of the reversible board is populated; the symmetric slot covers both).
#
# Outputs are .jscad (ergogen v4 no longer exports STL directly). Convert
# with the justfile recipe:
#   just ergogen-stl-from-jscad
# The `*_ol` outlines above also give DXFs for laser-cutting the plates.
cases:
  switch_plate:
    - what: outline
      name: switch_plate_ol
      extrude: plate_thickness
  bottom_plate:
    - what: outline
      name: bottom_plate_ol
      extrude: bottom_plate_thickness
  # ---------------------------------------------------------------------------
  # 3D-printed case: solid base + perimeter walls + screw standoffs.
  # Per flatfootfox: the base is a solid plate (no hotswap cutouts), walls
  # ring the perimeter, and solid cylindrical standoffs rise at each screw
  # position to support the PCB. Screw through-holes are subtracted last so
  # they pass through the standoffs too.
  # ---------------------------------------------------------------------------
  _case_base:
    - what: outline
      name: _case_base_ol
      extrude: bottom_plate_thickness
  # Walls: ring between the expanded outline and the board outline.
  # Walls rise 2mm above the standoffs (base + standoff_height + wall_height).
  _case_walls:
    - what: outline
      name: _wall_ring_ol
      extrude: bottom_plate_thickness + standoff_height + wall_height
  # Standoffs: solid cylinders at each screw position, rising standoff_height
  # above the base to support the PCB.
  _case_standoffs:
    - what: outline
      name: _standoff_ol
      extrude: bottom_plate_thickness + standoff_height
  # Screw through-holes: subtracted from the entire case so they pass through
  # the base, standoffs, and walls.
  _case_holes:
    - what: outline
      name: _holes_ol
      extrude: bottom_plate_thickness + standoff_height + wall_height
  # Switch cutout: through the full case height so the slider is accessible
  # from outside the wall.
  _case_switch_cutout:
    - what: outline
      name: _switch_wall_cutout_ol
      extrude: bottom_plate_thickness + standoff_height + wall_height
  case:
    - what: case
      name: _case_base
    - what: case
      name: _case_walls
      operation: add
    - what: case
      name: _case_standoffs
      operation: add
    - what: case
      name: _case_holes
      operation: subtract
    - what: case
      name: _case_switch_cutout
      operation: subtract
# ---------------------------------------------------------------------------
# 3D models
# ---------------------------------------------------------------------------
# Component STEP models live in `hardware/ergogen/3dmodels/` and are referenced in
# footprints via the `${ERGOGEN_3DMODELS}` KiCad path variable.
#
# To make KiCad's 3D viewer resolve them, add the variable once:
#   KiCad -> Preferences -> Configure Paths... -> Add
#     Name:  ERGOGEN_3DMODELS
#     Value: <absolute path to>/ergogenesis/hardware/ergogen/3dmodels
#
# Offsets below are taken from the ScottoKeebs/Axiom library, which uses these
# same STEP files. Fine-tune in KiCad's 3D viewer if a model sits off.
# Models used (downloaded from github.com/Andreyod1/Axiom):
#   choc_v1.step              - Kailh Choc V1 switch (PG1353)
#   choc_hotswap.step         - Choc hotswap socket
#   choc_keycap_1u.step       - MBK 1u keycap
#   switch_msk12c02.step      - MSK12C02 / SSSS811101 side slide switch
#   jst_ph_s2b.step           - JST PH 2.0 battery connector (S2B-PH)
#   supermini_nrf52840.step   - Nice!Nano V2 model as a SuperMini stand-in
#                              (same Pro Micro form factor / USB-C; no public
#                              SuperMini STEP exists - swap in a real one if
#                              you find it).
pcbs:
  shield-pcb:
    template: kicad8 # Required, since footprints are KiCad 8 only
    outlines:
      main:
        outline: board_ol
    footprints:
      key-fp:
        # what: choc
        # https://github.com/ceoloide/ergogen-footprints/blob/main/switch_choc_v1_v2.js
        # ./footprints/ceoloide/switch_choc_v1_v2.js
        what: ceoloide/switch_choc_v1_v2
        where:
          # true: all ZONES
          - /grid-zn/
          - /thumb-zn/
        params:
          choc_v1_support: true
          choc_v2_support: false
          reversible: true
          hotswap: true
          solder: true
          keycap_height: ky
          keycap_width: kx
          # alternate version?
          include_plated_holes: true
          include_traces_vias: true
          # freerouting
          locked_traces_vias: true
          from: GND
          to: "{{name}}"
          # --- 3D models ---
          # Switch body, hotswap socket, and MBK keycap. Keycap is rotated
          # [0,180,90] and lifted 7.7mm to sit atop the switch (matches the
          # ScottoKeebs CAD_Choc footprint these STEP files ship with).
          switch_3dmodel_filename: ${ERGOGEN_3DMODELS}/choc_v1.step
          switch_3dmodel_xyz_offset: [0, 0, 0]
          switch_3dmodel_xyz_rotation: [0, 0, 0]
          switch_3dmodel_xyz_scale: [1, 1, 1]
          hotswap_3dmodel_filename: ${ERGOGEN_3DMODELS}/choc_hotswap.step
          # 180° Z rotation flips the socket from bottom-right (where the
          # STEP model's origin sits by default, on the solder backup pins)
          # to top-left, where this reversible footprint's hotswap pads are.
          hotswap_3dmodel_xyz_offset: [0, 0, 0]
          hotswap_3dmodel_xyz_rotation: [0, 0, 180]
          hotswap_3dmodel_xyz_scale: [1, 1, 1]
          keycap_3dmodel_filename: ${ERGOGEN_3DMODELS}/choc_keycap_1u.step
          keycap_3dmodel_xyz_offset: [0, 0, 7.7]
          keycap_3dmodel_xyz_rotation: [0, 180, 90]
          keycap_3dmodel_xyz_scale: [1, 1, 1]

      mcu-fp:
        what: ceoloide/mcu_supermini_nrf52840
        where: [mcu]
        params:
          reversible: true
          reverse_mount: true
          # show_silk_labels: false
          # show_via_labels: false
          # show_instructions: false
          only_required_jumpers: true
          use_rectangular_jumpers: true
          # P0-P10
          # P14-P16
          # P18-P21
          P7: grid-zn_middle_bottom
          P18: grid-zn_pinky_home
          P19: grid-zn_pinky_top
          P20: grid-zn_index_top
          P21: grid-zn_inner_top
          # home
          P15: grid-zn_pinky_bottom
          P14: thumb-zn_near_thumb
          P16: thumb-zn_home_thumb
          P10: thumb-zn_far_thumb
          P1: grid-zn_middle_top
          # bottom
          P2: grid-zn_middle_home
          P3: grid-zn_index_home  
          P4: grid-zn_inner_home
          P5: grid-zn_ring_home
          P6: grid-zn_ring_bottom
          # thumb
          P8: grid-zn_index_bottom 
          P9: grid-zn_inner_bottom
          # from me...
          P0: grid-zn_ring_top
          # P0: thumb-zn_near_thumb
          # Others...
          # RAW
          # RST
          # VCC
          # GND
          # Silkscreen labels: short Arduino Pro Micro pin numbers
          # (net names above are unaffected; only the silk text changes).
          # See https://zmk.dev/docs/hardware-integration/pinctrl
          # P0_label: D0
          # P1_label: D1
          # P2_label: D2
          # P3_label: D3
          # P4_label: D4
          # P5_label: D5
          # P6_label: D6
          # P7_label: D7
          # P8_label: D8
          # P9_label: D9
          # P10_label: D10
          # P14_label: D14
          # P15_label: D15
          # P16_label: D16
          # P18_label: A0
          # P19_label: A1
          # P20_label: A2
          # P21_label: A3
          # Silkscreen labels: ergogen point names so you can trace a
          # KiCad pin back to its `Pxx:` assignment in this file.
          P0_label: P0
          P1_label: P1
          P2_label: P2
          P3_label: P3
          P4_label: P4
          P5_label: P5
          P6_label: P6
          P7_label: P7
          P8_label: P8
          P9_label: P9
          P10_label: P10
          P14_label: P14
          P15_label: P15
          P16_label: P16
          P18_label: P18
          P19_label: P19
          P20_label: P20
          P21_label: P21
          # --- 3D model ---
          # Nice!Nano V2 STEP as a visual stand-in for the SuperMini NRF52840
          # (same Pro Micro form factor + USB-C). Offset [0, 1.25, 2.5] lifts
          # the board to sit on the castellated pads.
          mcu_3dmodel_filename: ${ERGOGEN_3DMODELS}/supermini_nrf52840.step
          mcu_3dmodel_xyz_offset: [0, 1.25, 2.5]
          mcu_3dmodel_xyz_rotation: [0, 0, 0]
          mcu_3dmodel_xyz_scale: [1, 1, 1]
        # adjust:
        #   shift: [19.704, 0.375 kp -18.37]

      # reset-fp:
      #   # https://github.com/ergogen/ergogen/blob/develop/src/footprints/button.js
      #   what: button
