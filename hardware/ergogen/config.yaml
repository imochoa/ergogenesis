      on_off_switch-fp:
        #   # ./footprints/pcm12.js
        #   what: pcm12
        # ./footprints/ceoloide/power_switch_smd_side.js
        what: ceoloide/power_switch_smd_side
        # where: grid-zn_inner_top
        # where: [mcu]
        where: [grid-zn_inner_bottom]
        params:
          from: BAT_P
          to: RAW
          reversible: true
          # --- 3D model ---
          # MSK12C02 side slide switch (compatible with the SSSS811101 /
          # PCM12SMTR the footprint targets). Rotated 90° about Z because
          # the ceoloide footprint orients the pin row vertically (left edge)
          # while the STEP model was authored for a horizontal pin row.
          switch_3dmodel_filename: ${ERGOGEN_3DMODELS}/switch_msk12c02.step
          switch_3dmodel_xyz_offset: [0, 0, -0.05]
          switch_3dmodel_xyz_rotation: [0, 0, 90]
          switch_3dmodel_xyz_scale: [1, 1, 1]
        adjust:
          rotate: 0 
          # shift: [+0.5mcu_x -0.5 reset_x-13, -0.5mcu_y+41+4+0.5+3-3.5-0.5]
          # shift: [+28, -10]
          # shift: [+30.5, -10]
          shift: [+30.0, -10]

      battery_connector-fp:
        #   # ./footprints/jstkss2b-ph-kl.js
        #   what: jst-s2b-ph-kl
        # ./footprints/ceoloide/battery_connector_jst_ph_2.js
        what: ceoloide/battery_connector_jst_ph_2
        # where: grid-zn_inner_top
        # where: [mcu]
        where: [grid-zn_inner_bottom]
        params:
          BAT_P: BAT_P
          BAT_N: GND
          reversible: true
          trace_width: 0.3
          # --- 3D model ---
          # JST PH 2.0 side-entry connector. Uses the official KiCad library
          # S2B-PH-K horizontal STEP (same pad layout: pins at ±1, 0), so no
          # offset or rotation is needed.
          battery_connector_3dmodel_filename: ${ERGOGEN_3DMODELS}/jst_ph_s2b.step
          battery_connector_3dmodel_xyz_offset: [0, 0, 0]
          battery_connector_3dmodel_xyz_rotation: [0, 0, 0]
          battery_connector_3dmodel_xyz_scale: [1, 1, 1]
        adjust:
          # shift: [-10+12+4, -0.5 mcu_y+39+3+1+3+2-3.5]
          # shift: [-10+12+4, -0.5 mcu_y]
          # shift: [+20, -8]
          # shift: [+20, -8-4]
          shift: [+22, -8-4-2]
          # rotate: -90 +45
          # rotate: 0
          rotate: 180

      # reset_switch-fp:
      #   what: ceoloide/reset_switch_smd_side
      #   # where: grid-zn_inner_top
      #   where: [mcu]
