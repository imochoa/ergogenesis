# https://docs.zephyrproject.org/latest/develop/west/manifest.html

# west.yml
# ├── remotes are github orgs
# │   └── zmkfirmware
# └── projects are repos in those orgs (github:zmkfirmware/zmk)
#     └── zmk
#         ├── from remote "zmkfirmware"
#         └── revision: commit/branch/tag

manifest:
  # ZMK main's app/west.yml enables Zephyr's `optional` module group
  # (group-filter: [+optional]), which pulls large unused modules
  # (tflite-micro, thrift) into optional/. Disable it here in the top-level
  # manifest, which takes precedence over the imported filter.
  group-filter: [-optional]

  defaults:
    # remote: urob
    # ZMK main development line (Zephyr 4.1). Pinned to a specific commit below
    # for reproducibility; bump the SHA to move forward.
    revision: main

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK main @ 2026-07-21 (pulls Zephyr v4.1.0+zmk-fixes via app/west.yml)
      revision: f84ef436cd8e88f9d1580a9b86bab2fae8d349c6
      import: app/west.yml

    # - name: zmk-helpers
    #   remote: urob
    #   revision: v0.3.0 # set to same version as zmk above
    #   path: modules/zmk/helpers

  self:
    path: config
